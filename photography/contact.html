<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Contact — Francesco Giacomi Photography</title>
  <meta name="description" content="Scrivimi per qualsiasi cosa. Feedback, collaborazioni, o semplicemente per fare due chiacchiere.">
  <meta property="og:title" content="Contact — Francesco Giacomi Photography">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <header class="header header--solid">
    <a class="header__logo" href="index.html">Francesco Giacomi</a>
    <button class="header__toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="header__nav" aria-label="Navigazione principale">
      <a href="collections.html">Collections</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <div class="contact">
      <h1>Contattami</h1>
      <p>
        Per qualsiasi cosa — feedback, collaborazioni, o semplicemente per dire ciao.
      </p>

      <form class="contact-form" id="contact-form">
        <div class="form-field">
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="message">Messaggio</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="form-submit">Invia messaggio</button>
      </form>

      <div class="contact-email">
        <p>
          Oppure scrivimi direttamente a
          <a href="mailto:francescogiacomi1@gmail.com">francescogiacomi1@gmail.com</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span>&copy; <span id="footer-year">2026</span> Francesco Giacomi</span>
    <span>Photography</span>
  </footer>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
