  <meta property="og:title" content="Collection — Francesco Giacomi Photography">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <header class="header header--solid">
    <a class="header__logo" href="index.html">Francesco Giacomi</a>
    <button class="header__toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="header__nav" aria-label="Navigazione principale">
      <a href="collections.html">Collections</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <div class="story-header" id="story-header">
      <!-- Rendered by JS -->
    </div>

    <div class="story" id="story">
      <!-- Blocks rendered by JS from data/collections.json -->
    </div>

    <nav class="story-nav" id="story-nav" aria-label="Collezioni">
      <!-- Rendered by JS -->
    </nav>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Foto ingrandita">
    <button class="lightbox__close" aria-label="Chiudi">&times;</button>
    <button class="lightbox__arrow lightbox__arrow--prev" aria-label="Foto precedente">&#8249;</button>
    <button class="lightbox__arrow lightbox__arrow--next" aria-label="Foto successiva">&#8250;</button>
    <img class="lightbox__img" src="" alt="">
    <span class="lightbox__counter"></span>
    <span class="lightbox__caption"></span>
  </div>

  <footer class="footer">
    <span>&copy; <span id="footer-year">2026</span> Francesco Giacomi</span>
    <span>Photography</span>
  </footer>

  <script src="assets/js/app.js" defer></script>
